[Settings]
language = en
folder = ~/.config/myhypr/wallpapers
wallpaper = ~/.config/myhypr/wallpapers/default.jpg
backend = awww
monitors = All
fill = fill
sort = name
color = #ffffff
subfolders = False
show_hidden = False
show_gifs_only = False
# Keep filenames out of Waypaper's shell-based post-command expansion.
post_command =
number_of_columns = 3
use_xdg_state = False
show_path_in_tooltip = True
all_subfolders = False
zen_mode = False
