[Settings]
language = en
folder = ~/.config/ml4w/wallpapers
wallpaper = ~/.config/ml4w/wallpapers/default.jpg
backend = awww
monitors = All
fill = fill
sort = name
color = #ffffff
subfolders = False
show_hidden = False
show_gifs_only = False
post_command = ~/.config/hypr/scripts/wallpaper.sh "$wallpaper" > /dev/null 2>&1
number_of_columns = 3
use_xdg_state = False
show_path_in_tooltip = True
all_subfolders = False
zen_mode = False
stylesheet = ~/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini
