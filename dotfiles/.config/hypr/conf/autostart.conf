# Start Listeners
exec-once=~/.config/myhypr/listeners.sh --startall

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Load Wallpaper
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load Notification Daemon
exec-once = swaync

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Show the local welcome panel once
exec-once = ~/.config/myhypr/scripts/myhypr-autostart.sh

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Start the Top Bar (Waybar)
exec-once = ~/.config/waybar/launch.sh

# Start the Bottom Dock
exec-once = nwg-dock-hyprland -i 48 -w 5 -mb 10 -c "rofi -show drun"
