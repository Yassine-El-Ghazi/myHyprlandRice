general {
    # The lock wrapper is not recognized by automatic Hyprlock detection.
    inhibit_sleep = 3
    lock_cmd = ~/.config/hypr/scripts/power.sh lock # request a lock for this Wayland session.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"  # avoid pressing a key twice to turn on the display.
}

listener {
    timeout = 480                                # 8min.
    on-timeout = ~/.config/hypr/scripts/hypridle.sh dim
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
# listener { 
#     timeout = 480                                          # 8min.
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
#     on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
# }

listener {
    timeout = 300                                 # 5min; presentation mode keeps this lock timer.
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 660  # 11min
    on-timeout = ~/.config/hypr/scripts/hypridle.sh display-off
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })" && brightnessctl -r  # screen on and restore brightness after activity.
}

listener {
    timeout = 1800                                # 30min
    on-timeout = ~/.config/hypr/scripts/hypridle.sh suspend
}
